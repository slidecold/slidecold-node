name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Tag matches both package versions
        run: |
          node -e '
            const v = process.env.GITHUB_REF_NAME.replace(/^v/, "");
            const sdk = require("./packages/slidecold/package.json");
            const mcp = require("./packages/slidecold-mcp/package.json");
            const dep = mcp.dependencies.slidecold;
            if (sdk.version !== v || mcp.version !== v || dep !== v) {
              console.error(`tag ${v}, slidecold ${sdk.version}, slidecold-mcp ${mcp.version} (depends on slidecold ${dep})`);
              process.exit(1);
            }'
      - name: Generated code is up to date
        run: npm run generate && git diff --exit-code
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - name: Publish slidecold
        run: npm publish --provenance --access public --workspace slidecold
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish slidecold-mcp
        run: npm publish --provenance --access public --workspace slidecold-mcp
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## \\[?" v "\\]?" {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --generate-notes
